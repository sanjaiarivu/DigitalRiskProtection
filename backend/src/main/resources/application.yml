
server:
  port: 8080

spring:
  application:
    name: brandshield-api

  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:root-sanjaiarivazhagan03.k.aivencloud.com}:${DB_PORT:26007}/${DB_NAME:defaultdb}?sslMode=${DB_SSL_MODE:REQUIRED}}
    username: ${DB_USER:avnadmin}
    password: ${DB_PASS:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

app:
  demo-mode: ${DEMO_MODE:true}

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-1.5-flash}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}

    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      timeout-seconds: 30

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

logging:
  level:
    com.brandshield: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
