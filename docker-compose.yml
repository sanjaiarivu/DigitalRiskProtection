version: '3.8'

services:
  # =========================================================================
  # BrandShield AI — Full-Stack Application
  # =========================================================================
  brandshield-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brandshield-ai
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Use in-memory H2 (dev) or MySQL (prod)
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - DEMO_MODE=${DEMO_MODE:-true}
      # Google Gemini API key (passed from host .env or shell)
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
      # Optional OpenAI key
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # MySQL connection (used when SPRING_PROFILES_ACTIVE=prod)
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_NAME=brandshield
      - DB_USER=brandshield_user
      - DB_PASS=${MYSQL_PASSWORD:-change-me-local-app}
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - brandshield-net

  # =========================================================================
  # MySQL Database (Optional persistence for production profile)
  # =========================================================================
  mysql-db:
    image: mysql:8.0
    container_name: brandshield-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-local-root}
      MYSQL_DATABASE: brandshield
      MYSQL_USER: brandshield_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-local-app}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - brandshield-net

volumes:
  mysql_data:
    driver: local

networks:
  brandshield-net:
    driver: bridge
